      <table class="data-table">
        <thead><tr><th>Prioridad</th><th>Proyecto</th><th>Cliente</th><th>Videos restantes</th><th>Entrega</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` }

      <div class="section-head" style="margin-top:34px;"><div><span class="section-tag">Tu meta</span><h2 class="section-title">Proyección de ingresos</h2></div></div>
      ${ renderGoalWidget(editor, myTasks, false) }
    `;
  }

  function renderGoalWidget(editor, myTasks, editable){
    const goal = Number((editor && editor.goal) || 0);
    const earned = myTasks.reduce((s,t)=>s+Number(t.videosDone||0)*Number(t.pricePerVideo||0),0);
    const projected = myTasks.reduce((s,t)=>s+Number(t.videoCount||0)*Number(t.pricePerVideo||0),0);
    const totalVideosAssigned = myTasks.reduce((s,t)=>s+Number(t.videoCount||0),0);
    const pct = goal > 0 ? Math.min(100, (earned/goal)*100) : 0;

    let message;
    if(goal <= 0){
      message = 'Definí una meta de dinero para ver qué te falta hacer para alcanzarla.';
    } else if(earned >= goal){
      message = 'Ya alcanzaste tu meta con lo que llevás generado.';
    } else if(projected >= goal){
      const remaining = goal - earned;
      const avgPrice = totalVideosAssigned > 0 ? (projected/totalVideosAssigned) : 0;
      const videosNeeded = avgPrice > 0 ? Math.ceil(remaining/avgPrice) : 0;
      message = `Con las tareas que ya tenés asignadas alcanzás la meta. Te faltan aproximadamente ${videosNeeded} video${videosNeeded===1?'':'s'} más (${fmtMoney(remaining)}) para llegar.`;
    } else {
      const shortfall = goal - projected;
      message = `Con las tareas asignadas ahora no llegás a la meta — te faltaría trabajo asignado por unos ${fmtMoney(shortfall)} más. Hablalo con tu administrador.`;
    }

    const editableHtml = editable ? `
      <div class="field-row" style="margin-top:20px;">
        <div class="field"><label class="field-label">Tu meta ($)</label><input type="number" min="0" step="0.01" id="input-goal-amount" value="${goal || ''}" placeholder="Ej: 300000"></div>
        <div style="display:flex; align-items:flex-end;"><button class="btn btn-primary btn-sm" id="btn-save-goal" style="width:100%;">Guardar meta</button></div>
      </div>` : '';

    return `
      <div class="goal-box">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <span class="mono" style="font-size:11px;">Meta ${fmtMoney(goal)}</span>
          <span class="mono" style="font-size:11px;">${fmtMoney(earned)} / ${fmtMoney(goal)}</span>
        </div>
        <div class="goal-track"><div class="goal-fill" style="width:${pct}%;"></div></div>
        <div class="goal-pct">${pct.toFixed(0)}% completado</div>
        <p class="goal-message">${escapeHtml(message)}</p>
        ${editableHtml}
      </div>
    `;
  }

  function renderProyeccionesEditor(){
    const editor = state.editors.find(e=>e.id===effectiveEditorId());
    const myTasks = state.tasks.filter(t=>t.editorId===effectiveEditorId());
    const totalVideos = myTasks.reduce((s,t)=>s+Number(t.videoCount||0),0);
    const doneVideos = myTasks.reduce((s,t)=>s+Number(t.videosDone||0),0);
    const projected = myTasks.reduce((s,t)=>s+Number(t.videoCount||0)*Number(t.pricePerVideo||0),0);
    const paidToDate = myTasks.reduce((s,t)=>s+Number(t.videosDone||0)*Number(t.pricePerVideo||0),0);
    const remaining = projected - paidToDate;
    const preview = isPreviewMode();

    const rows = myTasks.map(t=>`
      <tr><td>${escapeHtml(t.project)}</td><td>${escapeHtml(clientName(t.clientId))}</td><td class="mono">${t.videosDone}/${t.videoCount}</td><td class="mono">${fmtMoney(t.pricePerVideo)}</td><td class="mono">${fmtMoney(Number(t.videoCount||0)*Number(t.pricePerVideo||0))}</td></tr>
    `).join('');

    const trackerSection = preview ? `
      <div class="goal-box">
        <div class="link-row"><span class="field-label-inline">Tracker</span>${ editor && editor.trackerLink ? `<a class="open-link" href="${escapeHtml(editor.trackerLink)}" target="_blank" rel="noopener">${escapeHtml(editor.trackerLink)}</a>` : `<span style="color:var(--ink-soft); font-size:12.5px;">Todavía no cargó un link</span>` }</div>
        <p class="goal-message">Solo lectura en vista previa — esto lo edita el editor desde su propia cuenta.</p>
      </div>` : `
      <div class="goal-box">
        <div class="field-row">
          <div class="field"><label class="field-label">Link de tu tracker</label><input type="text" id="input-tracker-link" value="${escapeHtml(editor && editor.trackerLink || '')}" placeholder="https://..."></div>
          <div style="display:flex; align-items:flex-end;"><button class="btn btn-primary btn-sm" id="btn-save-tracker" style="width:100%;">Guardar</button></div>
        </div>
        <p class="goal-message">Tu administrador va a poder ver este link desde su resumen, junto con tu avance.</p>
      </div>`;

    const notificationSection = preview ? `
      <div class="goal-box">
        <div class="task-meta">
          <span>Email de avisos <span class="mono">${editor && editor.notificationEmail ? escapeHtml(editor.notificationEmail) : 'sin cargar'}</span></span>
          <span>WhatsApp <span class="mono">${editor && editor.notificationPhone ? escapeHtml(editor.notificationPhone) : 'sin cargar'}</span></span>
        </div>
        <p class="goal-message">Solo lectura en vista previa — esto lo edita el editor desde su propia cuenta.</p>
      </div>` : `
      <div class="goal-box">
        <div class="field-row">
          <div class="field"><label class="field-label">Email para avisos</label><input type="email" id="input-notification-email" value="${escapeHtml(editor && editor.notificationEmail || '')}" placeholder="vos@gmail.com"></div>
          <div class="field"><label class="field-label">WhatsApp (con código de país)</label><input type="text" id="input-notification-phone" value="${escapeHtml(editor && editor.notificationPhone || '')}" placeholder="Ej: 5491122334455"></div>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-save-notification-contact">Guardar</button>
        <p class="goal-message">Cuando a una tarea tuya le falten 3, 2 o 1 día para la entrega (y todavía no esté completa), te llega un email acá. El aviso por WhatsApp/SMS todavía no está activo — por ahora solo guardamos el número para cuando lo esté.</p>
      </div>`;

    return `
      <div class="section-head"><div><span class="section-tag">Tu meta</span><h2 class="section-title">Proyección de ingresos</h2></div></div>
      ${ renderGoalWidget(editor, myTasks, !preview) }

      <div class="section-head" style="margin-top:34px;"><div><span class="section-tag">Tu tracker</span><h2 class="section-title">Link de seguimiento</h2></div></div>
      ${trackerSection}

      <div class="section-head" style="margin-top:34px;"><div><span class="section-tag">Avisos</span><h2 class="section-title">Recordatorios de entrega</h2></div></div>
      ${notificationSection}

      <div class="section-head" style="margin-top:34px;"><div><span class="section-tag">Detalle</span><h2 class="section-title">Tus tareas y montos</h2></div></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Videos asignados</div><div class="stat-value">${doneVideos}/${totalVideos}</div></div>
        <div class="stat-card"><div class="stat-label">Generado a la fecha</div><div class="stat-value">${fmtMoney(paidToDate)}</div></div>
        <div class="stat-card"><div class="stat-label">Falta por generar</div><div class="stat-value">${fmtMoney(remaining)}</div></div>
        <div class="stat-card"><div class="stat-label">Total proyectado</div><div class="stat-value">${fmtMoney(projected)}</div></div>
      </div>
      ${ myTasks.length === 0 ? emptyState('No tenés tareas asignadas todavía', 'Cuando el administrador te asigne un proyecto, va a aparecer acá.') : `
      <table class="data-table">
        <thead><tr><th>Proyecto</th><th>Cliente</th><th>Videos</th><th>Precio/video</th><th>Total</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` }
    `;
  }

  function renderTareas(isAdmin){
    let tasks = state.tasks.slice();
    if(!isAdmin){ tasks = tasks.filter(t=>t.editorId===effectiveEditorId()); }
    else {
      if(state.filter.editorId) tasks = tasks.filter(t=>t.editorId===state.filter.editorId);
      if(state.filter.clientId) tasks = tasks.filter(t=>t.clientId===state.filter.clientId);
      if(state.filter.status) tasks = tasks.filter(t=>taskStatus(t)===state.filter.status);
      if(state.filter.priority) tasks = tasks.filter(t=>(t.priority||'media')===state.filter.priority);
    }
    tasks.sort((a,b)=>{
      const pa = priorityRank(a.priority), pb = priorityRank(b.priority);
      if(pa !== pb) return pa - pb;
      return (a.deadline||'9999').localeCompare(b.deadline||'9999');
    });

    const filterBar = isAdmin ? `
      <div class="filter-bar">
        <select id="filter-editor"><option value="">Todos los editores</option>${state.editors.map(e=>`<option value="${e.id}" ${state.filter.editorId===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}</select>
        <select id="filter-client"><option value="">Todos los clientes</option>${state.clients.map(c=>`<option value="${c.id}" ${state.filter.clientId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select>
        <select id="filter-status">
          <option value="">Todos los estados</option>
          <option value="pendiente" ${state.filter.status==='pendiente'?'selected':''}>Pendiente</option>
          <option value="progreso" ${state.filter.status==='progreso'?'selected':''}>En progreso</option>
          <option value="completado" ${state.filter.status==='completado'?'selected':''}>Completado</option>
          <option value="atrasado" ${state.filter.status==='atrasado'?'selected':''}>Atrasado</option>
        </select>
        <select id="filter-priority">
          <option value="">Todas las prioridades</option>
          <option value="alta" ${state.filter.priority==='alta'?'selected':''}>Alta</option>
          <option value="media" ${state.filter.priority==='media'?'selected':''}>Media</option>
          <option value="baja" ${state.filter.priority==='baja'?'selected':''}>Baja</option>
        </select>
      </div>` : '';

    const addBtn = `
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" id="btn-new-task">+ Nueva tarea</button>
        ${ isAdmin ? `<button class="btn btn-ghost btn-sm" id="btn-new-task-bulk">+ Varias tareas</button>` : '' }
      </div>`;

    const columnsHtml = TASK_WORKFLOW_STATUSES.map(status=>{
      const colTasks = tasks.filter(t=>(t.workflowStatus||'Sin editar')===status);
      const cards = colTasks.map(t=>renderTaskKanbanCard(t, isAdmin)).join('');
      return `
        <div class="kanban-column" data-kanban-status="${escapeHtml(status)}">
          <div class="kanban-col-head">
            <span class="kanban-col-title">${escapeHtml(status)}</span>
            <span class="kanban-col-count">${colTasks.length}</span>
          </div>
          <div class="kanban-column-drop">
          ${ colTasks.length === 0 ? `<div class="kanban-empty">Soltá una tarea acá</div>` : cards }
          </div>
        </div>`;
    }).join('');

    return `
      <div class="section-head">
        <div><span class="section-tag">${isAdmin?'03 — Asignaciones':'Asignado a vos'}</span><h2 class="section-title">${isAdmin ? 'Tareas' : 'Mis tareas'}</h2></div>
        ${addBtn}
      </div>
      ${filterBar}
      ${ tasks.length === 0 ? emptyState(
          isAdmin ? 'No hay tareas todavía' : 'Todavía no tenés tareas asignadas',
          isAdmin ? 'Creá una tarea y asignala a un editor y un cliente.' : 'Tu administrador te va a asignar proyectos acá.'
        ) : `<div class="kanban-board">${columnsHtml}</div>` }
    `;
  }

  function renderArchivo(isAdmin){
    let tasks = state.tasks.filter(t=>t.workflowStatus === 'Listo');
    if(!isAdmin){ tasks = tasks.filter(t=>t.editorId===effectiveEditorId()); }
    else {
      if(state.filter.editorId) tasks = tasks.filter(t=>t.editorId===state.filter.editorId);
      if(state.filter.clientId) tasks = tasks.filter(t=>t.clientId===state.filter.clientId);
    }

    const groups = new Map();
    tasks.forEach(t=>{
      const key = monthKey(t.deadline) || 'sin-fecha';
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    });
    const sortedKeys = [...groups.keys()].sort((a,b)=>{
      if(a==='sin-fecha') return 1;
      if(b==='sin-fecha') return -1;
      return b.localeCompare(a); // más reciente primero
    });

    const filterBar = isAdmin ? `
      <div class="filter-bar">
        <select id="filter-editor"><option value="">Todos los editores</option>${state.editors.map(e=>`<option value="${e.id}" ${state.filter.editorId===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}</select>
        <select id="filter-client"><option value="">Todos los clientes</option>${state.clients.map(c=>`<option value="${c.id}" ${state.filter.clientId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select>
      </div>` : '';

    const groupsHtml = sortedKeys.map(key=>{
      const groupTasks = groups.get(key).slice().sort((a,b)=>(b.deadline||'').localeCompare(a.deadline||''));
      const label = key === 'sin-fecha' ? 'Sin fecha de entrega' : monthLabel(key);
      const cards = groupTasks.map(t=>renderTaskCard(t, isAdmin)).join('');
      return `
        <div class="section-head" style="margin-top:28px;"><div><span class="section-tag">${groupTasks.length} tarea${groupTasks.length===1?'':'s'}</span><h2 class="section-title" style="font-size:18px;">${escapeHtml(label)}</h2></div></div>
        <div class="task-list">${cards}</div>
      `;
    }).join('');

    return `
      <div class="section-head">
        <div><span class="section-tag">Completadas</span><h2 class="section-title">Archivo</h2></div>
      </div>
      ${filterBar}
      ${ tasks.length === 0 ? emptyState('Todavía no hay tareas archivadas', 'Cuando marqués una tarea como "Listo" o toqués "Completado", se va a guardar acá agrupada por mes.') : groupsHtml }
    `;
  }

  function renderTaskKanbanCard(t, isAdmin){
    const overdue = isOverdue(t);
    const deadlineHtml = t.deadline
      ? `<div class="kanban-card-deadline${overdue?' kanban-card-deadline-overdue':''}">${overdue?'▲ ':''}${fmtDate(t.deadline)}</div>`
      : '';
    return `<button type="button" class="kanban-card" draggable="true" data-drag-task="${t.id}" data-open-task="${t.id}" data-open-task-admin="${isAdmin?1:0}">${escapeHtml(t.project)}${deadlineHtml}</button>`;
  }

  function renderTaskDetailModal(id, isAdmin){
    const t = state.tasks.find(x=>x.id===id);
    if(!t){
      return `
      <div class="modal-backdrop" id="modal-backdrop"><div class="modal" style="max-width:420px;">
        <h3>Tarea no encontrada</h3>
        <p class="goal-message">Puede que se haya eliminado.</p>
        <div class="modal-actions"><button class="btn btn-ghost" id="btn-cancel-modal">Cerrar</button></div>
      </div></div>`;
    }
    return `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal" style="max-width:640px;">
        <div style="display:flex; justify-content:flex-end; margin-bottom:14px;">
          <button class="btn btn-ghost btn-sm" id="btn-cancel-modal">Cerrar</button>
        </div>
        <div class="task-detail-inner">${renderTaskCard(t, isAdmin)}</div>
      </div>
    </div>`;
  }

  function renderTaskCard(t, isAdmin){
    const status = taskStatus(t);
    const count = Math.max(Number(t.videoCount||0), 1);
    const units = Array.from({length: count}).map((_,i)=> `<div class="unit ${i < Number(t.videosDone||0) ? 'done':''}">${String(i+1).padStart(2,'0')}</div>`).join('');
    const totalAmount = Number(t.videoCount||0)*Number(t.pricePerVideo||0);
    const generatedAmount = Number(t.videosDone||0)*Number(t.pricePerVideo||0);

    return `
    <div class="task-card">
      <div class="task-top">
        <div>
          <div class="task-project">${escapeHtml(t.project)}</div>
          <div class="task-client">${escapeHtml(clientName(t.clientId))}${isAdmin ? ' · ' + escapeHtml(editorName(t.editorId)) : ''}</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          <span class="status-tag status-${status}">${statusLabel(status)}</span>
          ${priorityTagHtml(t.priority)}
          ${ t.paid ? `<span class="status-tag" style="border-color:var(--ink); color:var(--ink-soft);">✓ Pagado</span>` : '' }
        </div>
      </div>

      <div class="task-meta">
        <span>Entrega <input type="date" class="mono" style="border:1px solid var(--paper-line); padding:3px 6px; font-size:12.5px;" value="${t.deadline||''}" data-deadline-id="${t.id}"></span>
        <span>Precio/video (editor) <span class="mono">${fmtMoney(t.pricePerVideo)}</span></span>
        ${ isAdmin && t.clientPricePerVideo ? `<span>Precio/video (cliente) <span class="mono">${fmtMoney(t.clientPricePerVideo)}</span></span>` : '' }
      </div>

      <div class="field">
        <label class="field-label">Estado de edición</label>
        <select data-workflow-id="${t.id}">
          ${TASK_WORKFLOW_STATUSES.map(s=>`<option value="${escapeHtml(s)}" ${t.workflowStatus===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
        </select>
      </div>

      <div>
        <div class="unit-grid">${units}</div>
        <div class="unit-label">${t.videosDone||0} / ${t.videoCount||0} videos completados</div>
      </div>

      <div class="progress-editor">
        <input type="range" min="0" max="${t.videoCount||0}" value="${t.videosDone||0}" data-progress-id="${t.id}">
        <span class="mono" style="width:46px;text-align:right;">${t.videosDone||0}/${t.videoCount||0}</span>
      </div>

      <div class="task-links">
        <div class="link-row">
          <span class="field-label-inline">Crudo</span>
          <input type="text" placeholder="Link del material crudo" value="${escapeHtml(t.rawLink||'')}" data-link-id="${t.id}" data-link-type="rawLink">
          ${ t.rawLink ? `<a class="open-link" href="${escapeHtml(t.rawLink)}" target="_blank" rel="noopener">Abrir</a>` : '' }
        </div>
        <div class="link-row">
          <span class="field-label-inline">Guión</span>
          <input type="text" placeholder="Link del guión (si tiene)" value="${escapeHtml(t.scriptLink||'')}" data-link-id="${t.id}" data-link-type="scriptLink">
          ${ t.scriptLink ? `<a class="open-link" href="${escapeHtml(t.scriptLink)}" target="_blank" rel="noopener">Abrir</a>` : '' }
        </div>
        <div class="link-row">
          <span class="field-label-inline">Editado</span>
          <input type="text" placeholder="Link del material editado" value="${escapeHtml(t.editedLink||'')}" data-link-id="${t.id}" data-link-type="editedLink">
          ${ t.editedLink ? `<a class="open-link" href="${escapeHtml(t.editedLink)}" target="_blank" rel="noopener">Abrir</a>` : '' }
        </div>
        <div class="link-row">
          <span class="field-label-inline">Referente</span>
          <input type="text" placeholder="Link de referencia de edición (si tiene)" value="${escapeHtml(t.editReferenceLink||'')}" data-link-id="${t.id}" data-link-type="editReferenceLink">
          ${ t.editReferenceLink ? `<a class="open-link" href="${escapeHtml(t.editReferenceLink)}" target="_blank" rel="noopener">Abrir</a>` : '' }
        </div>
      </div>

      ${ t.notes ? `<p style="margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.5; border-top:1px solid var(--paper-line); padding-top:10px;">${escapeHtml(t.notes)}</p>` : '' }

      <div class="task-footer">
        <div>
          <span class="rate-tag">TOTAL ${fmtMoney(totalAmount)}</span>
          ${ isAdmin ? `<div class="mono" style="font-size:10px; color:var(--ink-soft); margin-top:3px; text-transform:none; letter-spacing:0;">Generado ${fmtMoney(generatedAmount)} ${t.paid ? '· ya pagado' : '· sin pagar'}</div>` : '' }
        </div>
        <div class="task-actions">
          ${ t.clientId ? `<button class="btn btn-ghost btn-sm" data-view-client="${t.clientId}">Ver cliente</button>` : '' }

          ${ isAdmin ? `<button class="btn btn-ghost btn-sm" data-toggle-paid="${t.id}">${t.paid ? 'Marcar sin pagar' : 'Marcar pagado'}</button>` : '' }
          <button class="btn btn-ghost btn-sm" data-duplicate-task="${t.id}">Duplicar</button>

  function renderEditoresManage(){
    const rows = state.editors.map(e=>{
      const myTasks = state.tasks.filter(t=>t.editorId===e.id);
      const n = myTasks.length;
      const videosRemaining = myTasks.reduce((s,t)=>s+Math.max(Number(t.videoCount||0)-Number(t.videosDone||0),0),0);

  function renderClientProfile(client, isAdmin){
    const clientTasks = state.tasks.filter(t=>t.clientId===client.id);

    const linkRow = (label, url) => `
      <div class="link-row">

  function renderMoneyDonut(segments){
    const size = 180, strokeWidth = 26;
    const radius = (size - strokeWidth) / 2;
    const circumference = 2 * Math.PI * radius;
    const opacities = [1, 0.72, 0.52, 0.34, 0.18];
    const total = segments.reduce((s,x)=>s+Math.max(x.value,0),0);

    let acc = 0;
    const arcs = total <= 0 ? '' : segments.map((seg, i) => {
      const fraction = Math.max(seg.value,0) / total;
      if(fraction <= 0) return '';
      const dash = fraction * circumference;
      const gapLen = circumference - dash;
      const dashOffset = -acc * circumference;
      acc += fraction;
      return `<circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="var(--ink)" stroke-opacity="${opacities[i % opacities.length]}" stroke-width="${strokeWidth}" stroke-dasharray="${dash.toFixed(2)} ${gapLen.toFixed(2)}" stroke-dashoffset="${dashOffset.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"></circle>`;
    }).join('');

    const legend = segments.map((seg,i) => {
      const pct = total > 0 ? (Math.max(seg.value,0)/total*100) : 0;
      return `<div class="donut-legend-item">
        <span class="donut-swatch" style="opacity:${opacities[i % opacities.length]}"></span>
        <span class="donut-legend-label">${escapeHtml(seg.label)}</span>
        <span class="mono donut-legend-value">${fmtMoney(seg.value)} · ${pct.toFixed(0)}%</span>
      </div>`;
    }).join('');

    return `
      <div class="donut-wrap">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="var(--paper-line)" stroke-width="${strokeWidth}"></circle>
          ${arcs}
        </svg>
        <div class="donut-legend">${ total > 0 ? legend : '<p class="empty-note">Todavía no hay ingresos cargados para mostrar el reparto.</p>' }</div>
      </div>`;
  }

  function renderFinanzas(){

    const netProfit = totalIncome - totalToHold;
    const totalEditingPaid = state.tasks.reduce((s,t)=>s+taskPaidAmount(t),0);

    const netProfitBeforePayingEditing = netProfit + totalEditingPending;
    const totalEditingCostProjected = state.tasks.reduce((s,t)=>s+Number(t.videoCount||0)*Number(t.pricePerVideo||0),0);
    const totalToHoldProjected = totalEditingCostProjected + totalReferrerCommission + totalGatewayFees + totalFixedExpenses;
    const netProfitProjected = totalIncome - totalToHoldProjected;
    const ownerPct = Number(state.financeSettings.ownerSharePct)||0;

  function emptyState(title, sub){ return `<div class="empty-state"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(sub)}</p></div>`; }

          render();

    const saveOwnerShareBtn = document.getElementById('btn-save-owner-share');

      const { error } = await supabase.from('finance_settings')

      await reloadData();
      render();

    document.querySelectorAll('[data-edit-editor]').forEach(btn=>{

      btn.onclick = () => {

        render();
      };

        if(!t) return;
        const previousPaid = t.paid;
        const { error } = await supabase.from('tasks').update({ paid: !previousPaid }).eq('id', t.id);

          const clientPrice = t ? Number(t.clientPricePerVideo||0) : 0;
          const { error } = await supabase.from('tasks').delete().eq('id', id);
          if(error) throw error;
          if(row) pushUndo('Eliminar tarea', async () => {
            const { error } = await supabase.from('tasks').insert(row);
            if(error) throw error;
            if(clientPrice){
              const { error: priceError } = await supabase.from('task_client_price')

              if(priceError) throw priceError;

          });

          render();

          } : null;

          const { data: affectedProfiles } = await supabase.from('profiles').select('id').eq('editor_id', id);
          const affectedProfileIds = (affectedProfiles || []).map(p=>p.id);

          const { error } = await supabase.from('editors').delete().eq('id', id);
          if(error) throw error;

          if(editorRow) pushUndo('Eliminar editor', async () => {
            const { error } = await supabase.from('editors').insert(editorRow);
            if(error) throw error;
            if(affectedTaskIds.length){
              const { error: taskErr } = await supabase.from('tasks').update({ editor_id: id }).in('id', affectedTaskIds);

            if(affectedProfileIds.length){
              const { error: profErr } = await supabase.from('profiles').update({ editor_id: id }).in('id', affectedProfileIds);

            payment_status: c.paymentStatus || '', amount_owed: c.amountOwed||0
          } : null;
          const hasFinanceData = financeRow && (financeRow.total_income || financeRow.gateway_fee || financeRow.referrer_id || financeRow.referrer_commission_pct || financeRow.referrer_paid || financeRow.payment_account_id || financeRow.payment_status || financeRow.amount_owed);
          const affectedTaskIds = state.tasks.filter(t=>t.clientId===id).map(t=>t.id);

          const { error } = await supabase.from('clients').delete().eq('id', id);
          if(error) throw error;

          if(clientRow) pushUndo('Eliminar cliente', async () => {
            const { error } = await supabase.from('clients').insert(clientRow);
            if(error) throw error;
            if(contractRow){
              const { error: contractErr } = await supabase.from('client_contracts').insert(contractRow);
              if(contractErr) throw contractErr;
            }
            if(hasFinanceData){
              const { error: financeErr } = await supabase.from('client_finance').insert(financeRow);
              if(financeErr) throw financeErr;
            }
            if(affectedTaskIds.length){
              const { error: taskErr } = await supabase.from('tasks').update({ client_id: id }).in('id', affectedTaskIds);
              if(taskErr) throw taskErr;
            }
          });

          await reloadData();
          render();
        }));
      };
    });

    document.querySelectorAll('[data-progress-id]').forEach(input=>{
      const originalDone = Number(input.value);
      input.oninput = () => {
        const t = state.tasks.find(x=>x.id===input.getAttribute('data-progress-id'));
        if(t){ t.videosDone = Number(input.value); const label = input.parentElement.querySelector('.mono'); if(label) label.textContent = `${t.videosDone}/${t.videoCount}`; }
      };
      input.onchange = () => withBusy(async () => {
        const t = state.tasks.find(x=>x.id===input.getAttribute('data-progress-id'));
        if(!t) return;
        const { error } = await supabase.from('tasks').update({ videos_done: t.videosDone }).eq('id', t.id);
        if(error) throw error;
        if(originalDone !== t.videosDone){
          pushUndo('Cambiar progreso de video', async () => {
            const { error } = await supabase.from('tasks').update({ videos_done: originalDone }).eq('id', t.id);
            if(error) throw error;
          });
        }
        await reloadData();
        render();
      });
    });

    document.querySelectorAll('[data-workflow-id]').forEach(select=>{
      select.onchange = () => updateWorkflowStatus(select.getAttribute('data-workflow-id'), select.value);
    });

    document.querySelectorAll('[data-deadline-id]').forEach(input=>{
      const originalValue = input.value;
      input.onchange = () => withBusy(async () => {
        const t = state.tasks.find(x=>x.id===input.getAttribute('data-deadline-id'));
        if(!t) return;
        const value = input.value || null;
        if(value === (originalValue || null)) return;
        const { error } = await supabase.from('tasks').update({ deadline: value }).eq('id', t.id);
        if(error) throw error;
        pushUndo('Cambiar fecha de entrega', async () => {
          const { error } = await supabase.from('tasks').update({ deadline: originalValue || null }).eq('id', t.id);
          if(error) throw error;
        });
        await reloadData();
        render();
      });
    });

    let draggedTaskId = null;
    document.querySelectorAll('.kanban-card[data-drag-task]').forEach(card=>{
      card.addEventListener('dragstart', (e)=>{
        draggedTaskId = card.getAttribute('data-drag-task');
        card.classList.add('dragging');
        if(e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', draggedTaskId); }
      });
      card.addEventListener('dragend', () => { card.classList.remove('dragging'); draggedTaskId = null; });
    });
    document.querySelectorAll('.kanban-column[data-kanban-status]').forEach(col=>{
      col.addEventListener('dragover', (e)=>{ e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect = 'move'; col.classList.add('drag-over'); });
      col.addEventListener('dragleave', (e)=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('drag-over'); });
      col.addEventListener('drop', (e)=>{
        e.preventDefault();
        col.classList.remove('drag-over');
        const id = draggedTaskId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
        const status = col.getAttribute('data-kanban-status');
        draggedTaskId = null;
        if(!id || !status) return;
        const t = state.tasks.find(x=>x.id===id);
        if(!t || t.workflowStatus === status) return;
        updateWorkflowStatus(id, status);
      });
    });

    document.querySelectorAll('[data-link-id]').forEach(input=>{
      const originalValue = input.value;
      input.onblur = () => withBusy(async () => {
        const t = state.tasks.find(x=>x.id===input.getAttribute('data-link-id'));
        const type = input.getAttribute('data-link-type');
        if(!t) return;
        const value = input.value.trim();
        if(value === originalValue) return;
        const columnByType = { rawLink: 'raw_link', editedLink: 'edited_link', scriptLink: 'script_link', editReferenceLink: 'edit_reference_link' };
        const column = columnByType[type] || 'edited_link';
        const { error } = await supabase.from('tasks').update({ [column]: value }).eq('id', t.id);
        if(error) throw error;
        pushUndo('Cambiar link de tarea', async () => {
          const { error } = await supabase.from('tasks').update({ [column]: originalValue }).eq('id', t.id);
          if(error) throw error;
        });
        await reloadData();
        render();
      });
    });
  }

    const editorOptions = state.editors.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');

      <div class="field"><label class="field-label">Nombres de los proyectos (uno por línea)</label><textarea id="input-bulk-projects" rows="6" placeholder="Crudos AD 1 Agosto&#10;Crudos AD 2 Agosto&#10;Crudos AD 3 Agosto"></textarea></div>

      <div class="field-row">
        <div class="field"><label class="field-label">Fecha de entrega</label><input type="date" id="input-bulk-deadline"></div>
        <div class="field"><label class="field-label">Precio por video (a favor del editor)</label><input type="number" min="0" step="0.01" id="input-bulk-price" value="0"></div>
      </div>
      <div class="field">
        <label class="field-label">Precio por video (lo que le cobrás al cliente)</label>
        <input type="number" min="0" step="0.01" id="input-bulk-client-price" value="0">
        <p class="field-hint">Opcional. Esto no lo ven los editores.</p>

      <div class="modal-actions"><button class="btn btn-ghost" id="btn-cancel-modal">Cancelar</button><button class="btn btn-primary" id="btn-save-bulk-tasks">Crear tareas</button></div>

  function renderTaskModal(data, restrictEditorId, seed){
    const src = data || seed || null;
    const canSeeClientPrice = state.currentUser.type === 'admin' && !isPreviewMode();
    const editorOptions = state.editors.map(e=>`<option value="${e.id}" ${src&&src.editorId===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('');
    const editorFieldHtml = restrictEditorId ? `
          <div class="field">
            <label class="field-label">Editor asignado</label>
            <input type="text" value="${escapeHtml(editorName(restrictEditorId))}" disabled style="opacity:0.65;">
            <input type="hidden" id="input-task-editor" value="${restrictEditorId}">
          </div>` : `
          <div class="field">
            <label class="field-label">Editor asignado</label>
            <select id="input-task-editor"><option value="">Sin asignar</option>${editorOptions}</select>
          </div>`;
    const initialClientId = src ? (src.clientId || '') : '';
    const initialClientName = initialClientId ? clientName(initialClientId) : '';
    return `
    <div class="modal-backdrop" id="modal-backdrop"><div class="modal">
      <h3>${data ? 'Editar tarea' : (seed ? 'Duplicar tarea' : 'Nueva tarea')}</h3>
      <div class="field"><label class="field-label">Nombre del proyecto</label><input type="text" id="input-task-project" value="${escapeHtml(src?src.project:'')}" placeholder="Ej: Reels agosto"></div>
      <div class="field-row">
        <div class="field" style="position:relative;">
          <label class="field-label">Cliente</label>
          <input type="text" id="input-task-client-search" placeholder="Buscar cliente..." autocomplete="off" value="${escapeHtml(initialClientName)}">
          <input type="hidden" id="input-task-client" value="${escapeHtml(initialClientId)}">
          <div id="client-suggestions" class="client-suggestions" style="display:none;"></div>
        </div>
        ${editorFieldHtml}
      </div>
      <div class="field-row">
        <div class="field"><label class="field-label">Cantidad de videos</label><input type="number" min="0" id="input-task-count" value="${src?src.videoCount:1}"></div>
        <div class="field"><label class="field-label">Prioridad</label>
          <select id="input-task-priority">
            <option value="alta" ${src&&src.priority==='alta'?'selected':''}>Alta</option>
            <option value="media" ${(!src || !src.priority || src.priority==='media')?'selected':''}>Media</option>
            <option value="baja" ${src&&src.priority==='baja'?'selected':''}>Baja</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label class="field-label">Fecha de entrega</label><input type="date" id="input-task-deadline" value="${src?src.deadline||'':''}"></div>
        <div class="field"><label class="field-label">Precio por video (a favor del editor)</label><input type="number" min="0" step="0.01" id="input-task-price" value="${src?src.pricePerVideo:0}"></div>
      </div>
      ${ canSeeClientPrice ? `
      <div class="field">
        <label class="field-label">Precio por video (lo que le cobrás al cliente)</label>
        <input type="number" min="0" step="0.01" id="input-task-client-price" value="${src?src.clientPricePerVideo||0:0}">
        <p class="field-hint">Opcional — cargalo si este proyecto tiene un precio de venta por video definido, para calcular el margen real (venta − pago al editor) en la ficha del cliente. Esto no lo ven los editores.</p>
      </div>` : '' }
      <div class="field">
        <label class="field-label">Estado de edición</label>
        <select id="input-task-workflow">
          ${TASK_WORKFLOW_STATUSES.map(s=>`<option value="${escapeHtml(s)}" ${src&&src.workflowStatus===s?'selected':(!src&&s==='Sin editar'?'selected':'')}>${escapeHtml(s)}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label class="field-label">Videos completados</label><input type="number" min="0" id="input-task-done" value="${src?src.videosDone:0}"></div>
        <div class="field">
          <label class="field-label">Pago</label>
          <label style="display:flex; align-items:center; gap:8px; padding:10px 0; font-size:13.5px;">
            <input type="checkbox" id="input-task-paid" style="width:auto;" ${src&&src.paid?'checked':''}>
            Ya está pagada
          </label>
        </div>
      </div>
      <div class="field"><label class="field-label">Link material crudo</label><input type="text" id="input-task-raw" value="${escapeHtml(src?src.rawLink||'':'')}" placeholder="https://..."></div>
      <div class="field"><label class="field-label">Link del guión (si tiene)</label><input type="text" id="input-task-script" value="${escapeHtml(src?src.scriptLink||'':'')}" placeholder="https://..."></div>
      <div class="field"><label class="field-label">Link material editado</label><input type="text" id="input-task-edited" value="${escapeHtml(src?src.editedLink||'':'')}" placeholder="https://..."></div>
      <div class="field"><label class="field-label">Referente de edición (si tiene)</label><input type="text" id="input-task-edit-reference" value="${escapeHtml(src?src.editReferenceLink||'':'')}" placeholder="https://..."></div>
      <div class="field"><label class="field-label">Notas</label><textarea id="input-task-notes" rows="3" placeholder="Contexto, pedidos del cliente, aprobaciones pendientes...">${escapeHtml(src?src.notes||'':'')}</textarea></div>
      <div class="modal-actions"><button class="btn btn-ghost" id="btn-cancel-modal">Cancelar</button><button class="btn btn-primary" id="btn-save-task">Guardar</button></div>
    </div></div>`;
  }

  let modalDirty = false;
  let lastAttachedModalRef = null;
  // Modales que no tienen botón "Guardar" propio — todo lo que hay adentro se
  // guarda solo al tipear/tocar, así que nunca hay "cambios sin guardar" que avisar.
  const MODAL_KINDS_WITHOUT_DIRTY_CHECK = ['confirm', 'task-detail'];

  function closeModal(){ modalDirty = false; lastAttachedModalRef = null; state.modal = null; render(); }

  function closeModalIfConfirmed(){
    if(modalDirty && state.modal && !MODAL_KINDS_WITHOUT_DIRTY_CHECK.includes(state.modal.kind)){
      if(!window.confirm('¿Salir sin guardar? Se va a perder lo que escribiste.')) return;
    }
    closeModal();
  }

  function attachModalEvents(){
    if(state.modal !== lastAttachedModalRef){ modalDirty = false; lastAttachedModalRef = state.modal; }
    const modalBox = document.querySelector('.modal');
    if(modalBox && state.modal && !MODAL_KINDS_WITHOUT_DIRTY_CHECK.includes(state.modal.kind)){
      modalBox.addEventListener('input', () => { modalDirty = true; });
      modalBox.addEventListener('change', () => { modalDirty = true; });
    }
    const backdrop = document.getElementById('modal-backdrop');
    if(backdrop) backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) closeModalIfConfirmed(); });
    const cancelBtn = document.getElementById('btn-cancel-modal');
    if(cancelBtn) cancelBtn.onclick = closeModalIfConfirmed;

    const debtHint = document.getElementById('finance-debt-hint');
    const totalChargeInput = document.getElementById('input-finance-total-charge');
    const financeIncomeInput = document.getElementById('input-finance-income');
    if(debtHint && totalChargeInput && financeIncomeInput){
      const updateDebtHint = () => {
        const totalCharge = Number(totalChargeInput.value) || 0;
        const income = Number(financeIncomeInput.value) || 0;
        const owed = totalCharge - income;
        debtHint.textContent = owed > 0 ? `Falta cobrar ${fmtMoney(owed)}.` : (totalCharge > 0 ? 'Ya se cobró todo.' : 'Cargá el total a cobrar para ver cuánto falta.');
      };
      totalChargeInput.addEventListener('input', updateDebtHint);
      financeIncomeInput.addEventListener('input', updateDebtHint);
    }

    const planHint = document.getElementById('finance-plan-hint');
    const paidVideosInput = document.getElementById('input-finance-paid-videos');
    const salePriceInput = document.getElementById('input-finance-sale-price');
    const editorPriceInput = document.getElementById('input-finance-editor-price');
    if(planHint && paidVideosInput && salePriceInput && editorPriceInput){
      const updatePlanHint = () => {
        const paidVideoCount = Number(paidVideosInput.value) || 0;
        const salePricePerVideo = Number(salePriceInput.value) || 0;
        const editorPricePerVideo = Number(editorPriceInput.value) || 0;
        planHint.textContent = clientPaidVideosPlanHint({ paidVideoCount, salePricePerVideo, editorPricePerVideo });
      };
      paidVideosInput.addEventListener('input', updatePlanHint);
      salePriceInput.addEventListener('input', updatePlanHint);
      editorPriceInput.addEventListener('input', updatePlanHint);
    }

    const clientSearch = document.getElementById('input-task-client-search');
    const clientHidden = document.getElementById('input-task-client');
    const clientSuggestionsBox = document.getElementById('client-suggestions');
    if(clientSearch && clientHidden && clientSuggestionsBox){
      const renderSuggestions = (query) => {
        const q = query.trim().toLowerCase();
        const matches = q ? state.clients.filter(c=>c.name.toLowerCase().includes(q)).slice(0,15) : state.clients.slice(0,15);
        if(matches.length === 0){ clientSuggestionsBox.style.display = 'none'; clientSuggestionsBox.innerHTML=''; return; }
        clientSuggestionsBox.innerHTML = matches.map(c=>`<div class="client-suggestion-item" data-client-option="${c.id}">${escapeHtml(c.name)}</div>`).join('');
        clientSuggestionsBox.style.display = 'block';
        clientSuggestionsBox.querySelectorAll('[data-client-option]').forEach(item=>{
          item.onmousedown = (e) => {
            e.preventDefault();
            const cid = item.getAttribute('data-client-option');
            const c = state.clients.find(x=>x.id===cid);
            clientHidden.value = cid;
            clientSearch.value = c ? c.name : '';
            clientSuggestionsBox.style.display = 'none';
          };
        });
      };
      clientSearch.addEventListener('focus', () => renderSuggestions(clientSearch.value));
      clientSearch.addEventListener('input', () => { clientHidden.value = ''; renderSuggestions(clientSearch.value); });
      clientSearch.addEventListener('blur', () => { setTimeout(()=>{ clientSuggestionsBox.style.display = 'none'; }, 120); });
    }

    const confirmYesBtn = document.getElementById('btn-confirm-yes');
    if(confirmYesBtn) confirmYesBtn.onclick = () => {
      const cb = state.modal && state.modal.onConfirm;
      state.modal = null;
      if(cb) cb();
    };

    const saveEditorBtn = document.getElementById('btn-save-editor');
    if(saveEditorBtn) saveEditorBtn.onclick = () => withBusy(async () => {
      const name = document.getElementById('input-editor-name').value.trim();
      if(!name) return;
      const email = document.getElementById('input-editor-email').value.trim().toLowerCase();
      const payoutAccountId = document.getElementById('input-editor-account').value || null;
      const data = state.modal.data;
      if(data){
        const { error } = await supabase.from('editors').update({ name, email: email || null, payout_account_id: payoutAccountId }).eq('id', data.id);
        if(error) throw error;
        if(email){
          await supabase.from('profiles').update({ editor_id: data.id, role: 'editor' }).eq('email', email).is('editor_id', null);
        }
      } else {
        const { data: inserted, error } = await supabase.from('editors').insert({ name, email: email || null, payout_account_id: payoutAccountId }).select().single();
        if(error) throw error;
        if(email && inserted){
          await supabase.from('profiles').update({ editor_id: inserted.id, role: 'editor' }).eq('email', email).is('editor_id', null);
        }
      }
      closeModal();
      await reloadData();
      render();
    });

    const saveClientBtn = document.getElementById('btn-save-client');
    if(saveClientBtn) saveClientBtn.onclick = () => withBusy(async () => {
      const name = document.getElementById('input-client-name').value.trim();
      if(!name) return;
      const email = document.getElementById('input-client-email').value.trim().toLowerCase();
      const payload = {
        name,
        status: document.getElementById('input-client-status').value,
        email: email || null,
        instagram_link: document.getElementById('input-client-instagram').value.trim(),
        drive_link: document.getElementById('input-client-drive').value.trim(),
        tracker_link: document.getElementById('input-client-tracker').value.trim(),
        reference_link: document.getElementById('input-client-reference').value.trim(),
        brand_manual_link: document.getElementById('input-client-brand-manual').value.trim(),
      };
      const contractLink = document.getElementById('input-client-contract').value.trim();
      const data = state.modal.data;
      let clientId = data ? data.id : null;
      if(data){
        const { error } = await supabase.from('clients').update(payload).eq('id', data.id);
        if(error) throw error;
      } else {
        const { data: inserted, error } = await supabase.from('clients').insert(payload).select().single();
        if(error) throw error;
        clientId = inserted.id;
      }
      if(email){
        await supabase.from('profiles').update({ client_id: clientId, role: 'client' }).eq('email', email).is('client_id', null);
      }
      const { error: contractError } = await supabase.from('client_contracts')
        .upsert({ client_id: clientId, contract_link: contractLink }, { onConflict: 'client_id' });
      if(contractError) throw contractError;
      closeModal();
      await reloadData();
      render();
    });

    const saveAccountBtn = document.getElementById('btn-save-account');
    if(saveAccountBtn) saveAccountBtn.onclick = () => withBusy(async () => {
      const name = document.getElementById('input-account-name').value.trim();
      if(!name) return;
      const payload = { name, balance: Number(document.getElementById('input-account-balance').value) || 0 };
      const data = state.modal.data;
      if(data){
        const { error } = await supabase.from('payment_accounts').update(payload).eq('id', data.id);
        if(error) throw error;
      } else {
        const { error } = await supabase.from('payment_accounts').insert(payload);
        if(error) throw error;
      }
      closeModal();
      await reloadData();
      render();
    });

    const saveExpenseBtn = document.getElementById('btn-save-expense');
    if(saveExpenseBtn) saveExpenseBtn.onclick = () => withBusy(async () => {
      const name = document.getElementById('input-expense-name').value.trim();
      if(!name) return;
      const payload = {
        name,
        cost: Number(document.getElementById('input-expense-cost').value) || 0,
        payout_account_id: document.getElementById('input-expense-account').value || null,
      };
      const data = state.modal.data;
      if(data){
        const { error } = await supabase.from('fixed_expenses').update(payload).eq('id', data.id);
        if(error) throw error;
      } else {
        const { error } = await supabase.from('fixed_expenses').insert(payload);
        if(error) throw error;
      }
      closeModal();
      await reloadData();
      render();
    });

    const saveReferrerBtn = document.getElementById('btn-save-referrer');
    if(saveReferrerBtn) saveReferrerBtn.onclick = () => withBusy(async () => {
      const name = document.getElementById('input-referrer-name').value.trim();
      if(!name) return;
      const payload = {
        name,
        payout_account_id: document.getElementById('input-referrer-account').value || null,
      };
      const data = state.modal.data;
      if(data){
        const { error } = await supabase.from('referrers').update(payload).eq('id', data.id);
        if(error) throw error;
      } else {
        const { error } = await supabase.from('referrers').insert(payload);
        if(error) throw error;
      }
      closeModal();
      await reloadData();
      render();
    });

    const saveClientFinanceBtn = document.getElementById('btn-save-client-finance');
    if(saveClientFinanceBtn) saveClientFinanceBtn.onclick = () => withBusy(async () => {
      const client = state.modal.data;
      const totalCharge = Number(document.getElementById('input-finance-total-charge').value) || 0;
      const totalIncome = Number(document.getElementById('input-finance-income').value) || 0;
      const payload = {
        client_id: client.id,
        total_charge: totalCharge,
        total_income: totalIncome,
        amount_owed: Math.max(totalCharge - totalIncome, 0),
        payment_status: document.getElementById('input-finance-payment-status').value,
        gateway_fee: Number(document.getElementById('input-finance-gateway').value) || 0,
        payment_account_id: document.getElementById('input-finance-account').value || null,
        referrer_id: document.getElementById('input-finance-referrer').value || null,
        referrer_commission_pct: Number(document.getElementById('input-finance-referrer-pct').value) || 0,
        referrer_paid: document.getElementById('input-finance-referrer-paid').checked,
        paid_video_count: Number(document.getElementById('input-finance-paid-videos').value) || 0,
        sale_price_per_video: Number(document.getElementById('input-finance-sale-price').value) || 0,
        editor_price_per_video: Number(document.getElementById('input-finance-editor-price').value) || 0,
      };
      const { error } = await supabase.from('client_finance').upsert(payload, { onConflict: 'client_id' });
      if(error) throw error;
      closeModal();
      await reloadData();
      render();
    });

    const assignStatusSubmit = document.getElementById('btn-assign-status-submit');
    if(assignStatusSubmit) assignStatusSubmit.onclick = () => withBusy(async () => {
      const status = document.getElementById('input-assign-status').value;
      const data = state.modal.data;
      const { error } = await supabase.from('clients').update({ status }).eq('id', data.id);
      if(error) throw error;
      closeModal();
      await reloadData();
      render();
    });

    const importClientsSubmit = document.getElementById('btn-import-clients-submit');
    if(importClientsSubmit) importClientsSubmit.onclick = () => withBusy(async () => {
      const raw = document.getElementById('input-import-clients').value;
      const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
      for(const line of lines){
        const parts = line.split('\t');
        const name = (parts[0]||'').trim();
        const status = (parts[1]||'').trim();
        if(!name) continue;
        const existing = state.clients.find(c=>c.name.toLowerCase()===name.toLowerCase());
        if(existing){
          if(status){ await supabase.from('clients').update({ status }).eq('id', existing.id); }
        } else {
          await supabase.from('clients').insert({ name, status });
        }
      }
      closeModal();
      await reloadData();
      render();
    });

    const importBackupSubmit = document.getElementById('btn-import-backup-submit');
    if(importBackupSubmit) importBackupSubmit.onclick = () => withBusy(async () => {
      const fileInput = document.getElementById('input-backup-file');
      const file = fileInput.files && fileInput.files[0];
      if(!file){ alert('Elegí un archivo .json primero.'); return; }
      const text = await file.text();
      let payload;
      try{ payload = JSON.parse(text); }
      catch(e){ throw new Error('El archivo no es un JSON válido.'); }

      const oldEditors = Array.isArray(payload.editors) ? payload.editors : [];
      const oldClients = Array.isArray(payload.clients) ? payload.clients : [];
      const oldTasks = Array.isArray(payload.tasks) ? payload.tasks : [];

      const editorIdMap = {};
      for(const oe of oldEditors){
        const existing = state.clients && state.editors.find(e=>e.name.toLowerCase()===String(oe.name||'').toLowerCase());
        if(existing){ editorIdMap[oe.id] = existing.id; continue; }
        const { data: inserted, error } = await supabase.from('editors')
          .insert({ name: oe.name || 'Sin nombre', goal: Number(oe.goal)||0, tracker_link: oe.trackerLink || '' })
          .select().single();
        if(error) throw error;
        editorIdMap[oe.id] = inserted.id;
        state.editors.push(editorFromRow(inserted));
      }

      const clientIdMap = {};
      for(const oc of oldClients){
        const existing = state.clients.find(c=>c.name.toLowerCase()===String(oc.name||'').toLowerCase());
        if(existing){ clientIdMap[oc.id] = existing.id; continue; }
        const { data: inserted, error } = await supabase.from('clients')
          .insert({ name: oc.name || 'Sin nombre', status: oc.status || '' })
          .select().single();
        if(error) throw error;
        clientIdMap[oc.id] = inserted.id;
        state.clients.push(clientFromRow(inserted));
      }

      let importedTasks = 0;
      for(const ot of oldTasks){
        const row = {
          project: ot.project || 'Sin nombre',
          client_id: clientIdMap[ot.clientId] || null,
          editor_id: editorIdMap[ot.editorId] || null,
          video_count: Number(ot.videoCount)||0,
          videos_done: Number(ot.videosDone)||0,
          priority: ot.priority || 'media',
          deadline: ot.deadline || null,
          price_per_video: Number(ot.pricePerVideo)||0,
          paid: !!ot.paid,
          raw_link: ot.rawLink || '',
          edited_link: ot.editedLink || '',
          notes: ot.notes || ''
        };
        const { error } = await supabase.from('tasks').insert(row);
        if(error) throw error;
        importedTasks++;
      }

      closeModal();
      await reloadData();
      render();
      alert(`Importación completa: ${oldEditors.length} editores, ${oldClients.length} clientes y ${importedTasks} tareas procesadas.`);
    });

    const saveBulkTasksBtn = document.getElementById('btn-save-bulk-tasks');
    if(saveBulkTasksBtn) saveBulkTasksBtn.onclick = () => withBusy(async () => {
      const names = document.getElementById('input-bulk-projects').value
        .split('\n').map(s=>s.trim()).filter(Boolean);
      if(!names.length) return;
      const shared = {
        clientId: document.getElementById('input-bulk-client').value,
        editorId: document.getElementById('input-bulk-editor').value,
        videoCount: Number(document.getElementById('input-bulk-count').value) || 0,
        priority: document.getElementById('input-bulk-priority').value || 'media',
        workflowStatus: 'Sin editar',
        deadline: document.getElementById('input-bulk-deadline').value,
        pricePerVideo: Number(document.getElementById('input-bulk-price').value) || 0,
        videosDone: 0, paid: false, rawLink: '', editedLink: '', scriptLink: '', editReferenceLink: '', notes: ''
      };
      const clientPrice = Number(document.getElementById('input-bulk-client-price').value) || 0;
      const rows = names.map(project => taskToRow({ ...shared, project }));
      const { data: inserted, error } = await supabase.from('tasks').insert(rows).select();
      if(error) throw error;
      if(inserted && inserted.length && clientPrice){
        const priceRows = inserted.map(row => ({ task_id: row.id, client_price_per_video: clientPrice }));
        const { error: priceError } = await supabase.from('task_client_price').insert(priceRows);
        if(priceError) throw priceError;
      }
      if(inserted && inserted.length){
        const ids = inserted.map(row => row.id);
        pushUndo(`Crear ${ids.length} tareas`, async () => {
          const { error } = await supabase.from('tasks').delete().in('id', ids);
          if(error) throw error;
        });
      }
      closeModal();
      await reloadData();
      render();
    });

    const saveTaskBtn = document.getElementById('btn-save-task');
    if(saveTaskBtn) saveTaskBtn.onclick = () => withBusy(async () => {
      const project = document.getElementById('input-task-project').value.trim();
      if(!project) return;
      let clientId = document.getElementById('input-task-client').value;
      if(!clientId){
        const typedName = document.getElementById('input-task-client-search').value.trim().toLowerCase();
        if(typedName){
          const match = state.clients.find(c=>c.name.toLowerCase() === typedName);
          if(match) clientId = match.id;
        }
      }
      const clientPriceInput = document.getElementById('input-task-client-price');
      const payload = {
        project,
        clientId,
        editorId: document.getElementById('input-task-editor').value,
        videoCount: Number(document.getElementById('input-task-count').value) || 0,
        priority: document.getElementById('input-task-priority').value || 'media',
        workflowStatus: document.getElementById('input-task-workflow').value || 'Sin editar',
        deadline: document.getElementById('input-task-deadline').value,
        pricePerVideo: Number(document.getElementById('input-task-price').value) || 0,
        videosDone: Number(document.getElementById('input-task-done').value) || 0,
        paid: document.getElementById('input-task-paid').checked,
        rawLink: document.getElementById('input-task-raw').value.trim(),
        editedLink: document.getElementById('input-task-edited').value.trim(),
        scriptLink: document.getElementById('input-task-script').value.trim(),
        editReferenceLink: document.getElementById('input-task-edit-reference').value.trim(),
        notes: document.getElementById('input-task-notes').value.trim(),
      };
      if(payload.videosDone > payload.videoCount) payload.videosDone = payload.videoCount;
      const data = state.modal.data;
      const row = taskToRow(payload);
      if(data){
        const oldRow = taskToRow(data);
        const oldClientPrice = Number(data.clientPricePerVideo||0);
        const { error } = await supabase.from('tasks').update(row).eq('id', data.id);
        if(error) throw error;
        if(clientPriceInput){
          const newClientPrice = Number(clientPriceInput.value) || 0;
          const { error: priceError } = await supabase.from('task_client_price')
            .upsert({ task_id: data.id, client_price_per_video: newClientPrice }, { onConflict: 'task_id' });
          if(priceError) throw priceError;
        }
        pushUndo('Editar tarea', async () => {
          const { error } = await supabase.from('tasks').update(oldRow).eq('id', data.id);
          if(error) throw error;
          if(clientPriceInput){
            const { error: priceError } = await supabase.from('task_client_price')
              .upsert({ task_id: data.id, client_price_per_video: oldClientPrice }, { onConflict: 'task_id' });
            if(priceError) throw priceError;
          }
        });
      } else {
        const { data: inserted, error } = await supabase.from('tasks').insert(row).select().single();
        if(error) throw error;
        if(inserted && clientPriceInput){
          const newClientPrice = Number(clientPriceInput.value) || 0;
          if(newClientPrice){
            const { error: priceError } = await supabase.from('task_client_price')
              .upsert({ task_id: inserted.id, client_price_per_video: newClientPrice }, { onConflict: 'task_id' });
            if(priceError) throw priceError;
          }
        }
        if(inserted) pushUndo('Crear tarea', async () => {
          const { error } = await supabase.from('tasks').delete().eq('id', inserted.id);
          if(error) throw error;
        });
      }
      closeModal();
      await reloadData();
      render();
    });
  }

  async function init(){
    render(); // pantalla de carga
    const { data: { session } } = await supabase.auth.getSession();
    await handleSession(session);
    supabase.auth.onAuthStateChange((_event, session) => { handleSession(session); });
  }

  init();
})();
</script>
</body>
</html>
